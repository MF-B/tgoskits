# Architecture identifier.
arch = "loongarch64"                            # str
# Platform identifier.
platform = "loongarch64-ls2k1000"              # str
# Platform package.
package = "ax-plat-loongarch64-ls2k1000"        # str

#
# Platform configs
#
[plat]
# Maximum number of CPUs. For platforms that do not support runtime CPU number
# detection, it's also the number of CPUs to boot.
max-cpu-num = 1                       # uint
# Base address of the low physical memory.
low-memory-base = 0x0                   # uint
# Size of the low physical memory. (256M)
low-memory-size = 0x1000_0000           # uint
# Base address of the high physical memory.
high-memory-base = 0x9000_0000          # uint
# Size of the whole physical memory. (2G)
phys-memory-size = 0x8000_0000           # uint

# Linear mapping offset at boot time.
phys-boot-offset = "0x9000_0000_0000_0000"      # uint
# Linear mapping offset, for quick conversions between physical and virtual
# addresses.
phys-virt-offset = "0x9000_0000_0000_0000"      # uint
# Offset of bus address and phys address. some boards, the bus address is
# different from the physical address.
phys-bus-offset = 0                             # uint

# Base physical address of the kernel image.
kernel-base-paddr = 0x0020_0000                 # uint
# Base virtual address of the kernel image.
kernel-base-vaddr = "0x9000_0000_0020_0000"     # uint
# Kernel address space base.
#
# The LS2K1000 platform uses two DMW windows: 0x8000... for uncached MMIO and
# 0x9000... for cached RAM/kernel memory. Paging kernels need both windows in
# the kernel address space because axmm maps every platform memory region.
kernel-aspace-base = "0x8000_0000_0000_0000"    # uint
# Kernel address space size.
kernel-aspace-size = "0x1000_ffff_ffff_f000"    # uint
# Stack size on bootstrapping. (256K)
boot-stack-size = 0x40000                       # uint

#
# Device specifications
#
[devices]
# MMIO ranges with format (`base_paddr`, `size`).
mmio-ranges = [
    [0x1FE0_0000, 0x0003_0000], # ICU, pinctrl, UART, RTC, syscon
    [0x4000_0000, 0x0010_0000], # USB, GMAC, display, AHCI
]           # [(uint, uint)]
# VirtIO MMIO ranges with format (`base_paddr`, `size`).
virtio-mmio-ranges = []    # [(uint, uint)]
# Base physical address of the PCIe ECAM space.
pci-ecam-base = 0             # uint
# End PCI bus number.
pci-bus-end = 0                      # uint
# PCI device memory ranges.
pci-ranges = []                                       # [(uint, uint)]
# serial@1fe20000 {
#     interrupt-parent = <0x00008003>;
#     interrupts = <0x00000000>;
#     reg = <0x00000000 0x1fe20000 0x00000000 0x00000010>;
#     compatible = "ns16550a";
# };
uart-paddr = 0x1FE2_0000                 # uint
uart-irq = 0                            # uint
uart-clock-frequency = 125_000_000      # uint

# Timer interrupt frequency in Hz.
timer-frequency = 100_000_000           # uint
# Timer interrupt number.
timer-irq = 11                          # uint
# IPI interrupt num
ipi-irq = 12                            # uint

# RTC address.
rtc-paddr = 0x1FE2_7800                 # uint

syscon-paddr = 0x1FE2_7000              # uint
poweroff-offset = 0x14                  # uint
poweroff-mask = 0x3C00                  # uint
poweroff-value = 0x3C00                 # uint
reboot-offset = 0x30                    # uint
reboot-mask = 0x1                       # uint

liointc-paddr = 0x1FE0_1400             # uint
liointc-isr-paddr = 0x1FE0_1040         # uint
# LIOINTC route INT0 is delivered as CPU HWI0 (ECFG bit 2).
liointc-irq = 0x02                      # uint

ahci-paddr = 0x400E_0000                # uint
ahci-irq = 19                           # uint
# Linux DTS uses `ports-implemented = <0x01>` for the LS2K1000 AHCI node.
ahci-ports-implemented = 0x1            # uint

gmac0-paddr = 0x4004_0000               # uint
gmac0-irq = 12                          # uint
gmac0-wake-irq = 13                     # uint

gmac1-paddr = 0x4005_0000               # uint
gmac1-irq = 14                          # uint
gmac1-wake-irq = 15                     # uint
